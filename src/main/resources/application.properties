# ============================================================
# CrowdCare - Konfigurasi H2 Database & JPA/Hibernate
# ============================================================

# Server berjalan di port 8080 (background, tidak terlihat user)
server.port=8080

# ============================================================
# H2 DATABASE
# ============================================================

# H2 berjalan in-memory (data reset setiap restart)
# Ganti ke file-based jika ingin data persisten:
# spring.datasource.url=jdbc:h2:file:./crowdcare-db
spring.datasource.url=jdbc:h2:mem:crowdcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Aktifkan H2 Console (bisa diakses di http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / HIBERNATE
# ============================================================

# Buat tabel otomatis dari entity class
spring.jpa.hibernate.ddl-auto=create-drop

# Tampilkan SQL query di console (berguna untuk debug)
spring.jpa.show-sql=true

# Format SQL agar mudah dibaca
spring.jpa.properties.hibernate.format_sql=true

# Dialect untuk H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================================
# LOGGING (kurangi noise di console)
# ============================================================
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE